<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="shortcut icon" href="imagens/favicon_home.png" type="image/x-icon">

    <title>FAVICONS e IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2>Homem Aranha</h2>
    <div><!-- tag para acrescentar imagens - img -->
     <img src="imagens/homem_aranha_best.png" alt=" Espetacular Homem aranha 2" title="O Espetacular Homem Aranha 2" align="down">
    </div>
    
     <h2>Homem Aranha - com proporção de imagens</h2>
     <div>
        <img src="imagens/homem_aranha_best.png"
        alt="O Espetacular Homem Aranha 2"
        title="O Espetacular Homem Aranha 2"
        width="800px"
        height="800px"
        >
    </div>

    <h2>O Espetacular Homem Aranha - com proporção de imagens com style</h2>
        <div><img src="imagens/homem_aranha_best.png" 
        alt="O Espetacular Homem Aranha 2" 
        title="O Espetacular Homem Aranha 2"
        style="margin: 20px;
        background-image: url(imagens/homem_aranha_best.png); 
        background-size: auto;
        background-repeat: repeat-x;
        width: 400px;
        height: 500;"
        >
    </div>
        
</body>
</html>
